name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -n 's/^VERSION=//p' cubicle)"
          [ "$want" = "$have" ] || { echo "tag v$want but VERSION=$have"; exit 1; }

      - name: Test
        run: make test

      - name: Build tarball
        run: |
          v="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="cubicle-$v/" \
              -o "cubicle-$v.tar.gz" "$GITHUB_REF_NAME"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
              --generate-notes "cubicle-${GITHUB_REF_NAME#v}.tar.gz"
